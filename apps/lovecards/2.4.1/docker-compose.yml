services:
  lovecards:
    image: lovecards-web-frankenphp:latest
    pull_policy: never
    container_name: "${CONTAINER_NAME}"
    restart: always
    networks:
      - 1panel-network
    ports:
      - "${PANEL_APP_PORT_HTTP}:80"
    environment:
      SERVER_NAME: "${WEB_SERVER_NAME}"
    volumes:
      - ./data/web/config:/app/config
      - ./data/web/public:/app/public
    depends_on:
      - mysql
    labels:
      createdBy: Apps
  mysql:
    image: mysql:5.7
    pull_policy: missing
    container_name: "${CONTAINER_NAME}-mysql"
    restart: always
    networks:
      - 1panel-network
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD}"
      MYSQL_DATABASE: lovecards
      MYSQL_USER: lovecards
      MYSQL_PASSWORD: "${MYSQL_PASSWORD}"
      TZ: "${MYSQL_TZ}"
    volumes:
      - ./data/mysql/mysql_data:/var/lib/mysql
      - ./data/mysql/mysql_conf:/etc/mysql/conf.d
      - ./data/mysql/mysql_logs:/var/log/mysql
    labels:
      createdBy: Apps
networks:
  1panel-network:
    external: true
